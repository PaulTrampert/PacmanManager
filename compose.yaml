# The largest package file RepoHost accepts, and the largest request body the web host proxies to it.
# The publish route's body is the raw package file, so one value puts the limit in the same place on
# both hops: an upload the web host forwards is never refused by RepoHost for its size.
x-max-upload-bytes: &max-upload-bytes "1073741824"

services:
  pacmanmanager.repohost:
    image: pacmanmanager.repohost
    build:
      context: .
      dockerfile: PacmanManager.RepoHost/Dockerfile
    ports:
      - "8082:8080"
    # What `docker compose up` needs with no other setup. Development is what lets the bearer
    # handler fetch Keycloak's metadata over plain HTTP, as the web host's does.
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Auth__Authority: "http://auth:8080/realms/localdev"
      ConnectionStrings__pacmanmanager: "Server=postgres;Database=pacmanmanager;User Id=pacmanmanager;Password=password;"
      PackagePublishing__MaxUploadBytes: *max-upload-bytes
      # The address a pacman client reaches RepoHost at, for each repository's serverUrl. Without it the
      # web UI, whose requests SpaHost proxies, would show SpaHost's upstream address instead.
      PublicUrl: "http://localhost:8082/"
    depends_on:
      auth:
        condition: service_started
      pacmanmanager.migrations:
        condition: service_completed_successfully

  # The web front end: the app's bundle in SpaHost, which signs users in against Keycloak and
  # proxies /api/pacmanmanager/... to RepoHost with their access token. Local development only; see
  # docs/web-ui-architecture/web-ui-architecture.md, "The compose service".
  pacmanmanager.web:
    image: pacmanmanager.web
    build:
      context: pacmanmanager-web
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AuthConfig__OidcConfig__Authority: "http://auth:8080/realms/localdev"
      AuthConfig__OidcConfig__ClientId: pacman-manager-web
      AuthConfig__OidcConfig__ClientSecret: Asdfasdf1
      AuthConfig__OidcConfig__Scopes__0: openid
      AuthConfig__OidcConfig__Scopes__1: offline_access
      AuthConfig__OidcConfig__Scopes__2: profile
      AuthConfig__OidcConfig__Scopes__3: email
      AuthConfig__OidcConfig__Scopes__4: pacman-manager
      AuthConfig__OidcConfig__Scopes__5: "pacman-manager:*:*"
      ApiProxy__PacmanManager__BaseUrl: "http://pacmanmanager.repohost:8080/api/"
      ApiProxy__PacmanManager__AuthType: "PTrampert.SpaHost.Authentication.OidcBearerAuthHandler, PTrampert.SpaHost"
      # Raised from Kestrel's 30 MB default, which a package upload routinely exceeds.
      ApiProxy__PacmanManager__MaxRequestBodySize: *max-upload-bytes
      # Passed through so a package download is saved under the package's own filename.
      ApiProxy__PacmanManager__ResponseHeaders__0: Content-Disposition
      # SpaHost's Development settings keep its data-protection keys in Redis, for replicas sharing
      # a session cookie. This stack runs one replica and has no Redis.
      RedisConfig__UseForDataProtection: "false"
    depends_on:
      - auth
      - pacmanmanager.repohost

  auth:
    image: quay.io/keycloak/keycloak
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/:/opt/keycloak/data/import/
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: "http://localhost:8080"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      
  pacmanmanager.migrations:
    image: pacmanmanager.migrations
    build:
      context: .
      dockerfile: PacmanManager.Migrations/Dockerfile
    depends_on:
      - postgres
        
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: pacmanmanager
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/
        
volumes:
  pgdata:

