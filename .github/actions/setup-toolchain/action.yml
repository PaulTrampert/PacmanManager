name: Set up the build toolchain
description: >-
  Installs what building and testing the solution on an Ubuntu runner needs: pacman tooling and
  libalpm, a JRE for the ANTLR build task, the .NET SDK, and a NuGet package cache, plus the Node
  LTS and an npm cache for pacmanmanager-web. Expects the repository to be checked out already,
  since the cache keys hash its project files and the web app's lockfile.

runs:
  using: composite
  steps:
    # The runner image is Ubuntu, and this is a pacman repository host. See
    # docs/cloud-environment.md, which installs the same set for cloud dev sessions:
    #   pacman-package-manager  repo-add / repo-remove, which RepoHost shells out to
    #   libalpm-dev             the libalpm.so symlink NativeMethods' DllImport resolves
    #   libarchive-tools, zstd  bsdtar and zstd, used by the package fixtures
    - name: Install pacman tooling and libalpm
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          pacman-package-manager \
          libalpm-dev \
          libarchive-tools \
          zstd

    # Antlr4BuildTasks runs the ANTLR jar to generate the pacman.conf parser, so the build
    # itself needs a JRE. Pinning one beats relying on whatever the runner image ships.
    # 25 is the current LTS and the newest ANTLR runs on: checked by deleting LibAlpmSharp/obj
    # and regenerating the parser under it, which produced the same sources and built clean.
    - name: Set up Java for the ANTLR build task
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'

    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
        restore-keys: nuget-${{ runner.os }}-

    # The web app's Node, read from its .nvmrc (`lts/*`), so the Claude workflows can build and
    # test pacmanmanager-web as well as the solution. web.yml sets Node up the same way.
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version-file: pacmanmanager-web/.nvmrc
        cache: npm
        cache-dependency-path: pacmanmanager-web/package-lock.json
