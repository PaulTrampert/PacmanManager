version: 2

# Each ecosystem is checked daily, and its version updates land together in one pull request per
# ecosystem: the single group under each entry below.
#
# Security updates are deliberately left out of those groups. A group only applies to security
# updates when it says `applies-to: security-updates`, so each one gets its own pull request. A
# security fix then never waits behind an unrelated package's breaking change in the daily batch.
# Security updates themselves are switched on in the repository settings, not here.
#
# Every PR title has to carry a change-level prefix for pr-title.yml. Dependabot puts a colon after
# a prefix that ends in ")", which the check rejects, so the prefix ends in a space instead.
updates:
  # The .csproj files the solution references, and the dotnet-ef tool in .config/dotnet-tools.json.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: daily
    groups:
      nuget:
        patterns: ["*"]
    commit-message:
      prefix: "(PATCH) "

  - package-ecosystem: docker
    directories:
      - /PacmanManager.RepoHost
      - /PacmanManager.Migrations
    schedule:
      interval: daily
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: "(PATCH) "

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: daily
    groups:
      docker-compose:
        patterns: ["*"]
    commit-message:
      prefix: "(PATCH) "

  # pacmanmanager-web's package.json and package-lock.json.
  - package-ecosystem: npm
    directory: /pacmanmanager-web
    schedule:
      interval: daily
    groups:
      npm:
        patterns: ["*"]
    # typescript-eslint pins TypeScript to a range of minor versions as a peer, and a TypeScript
    # major outside it fails `npm ci` with ERESOLVE, stalling the whole group. Take TypeScript
    # majors by hand once typescript-eslint supports them.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # babel-plugin-react-compiler is built against Babel 7's AST (it depends on
      # @babel/types ^7), and under Babel 8 it fails to compile ordinary code, such as a default in
      # an object pattern, which fails the build. Take Babel majors by hand once the compiler
      # supports them.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "(PATCH) "

  # "/" covers .github/workflows; the local composite actions have to be named separately.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "(PATCH) "
