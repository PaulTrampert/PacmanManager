version: 2

# Version updates for every ecosystem land together, once a day, in one pull request: the
# `dependencies` multi-ecosystem group below.
#
# Security updates are deliberately left out of that group. Neither `groups` nor
# `multi-ecosystem-groups` applies to them unless a group says `applies-to: security-updates`, so
# each one gets its own pull request. A security fix then never waits behind an unrelated
# package's breaking change in the daily batch. Security updates themselves are switched on in the
# repository settings, not here.
#
# Every PR title has to carry a change-level prefix for pr-title.yml. Dependabot puts a colon after
# a prefix that ends in ")", which the check rejects, so the prefix ends in a space instead.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: daily
    commit-message:
      prefix: "(PATCH) "

updates:
  # The .csproj files the solution references, and the dotnet-ef tool in .config/dotnet-tools.json.
  - package-ecosystem: nuget
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    commit-message:
      prefix: "(PATCH) "

  - package-ecosystem: docker
    directories:
      - /PacmanManager.RepoHost
      - /PacmanManager.Migrations
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    commit-message:
      prefix: "(PATCH) "

  - package-ecosystem: docker-compose
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    commit-message:
      prefix: "(PATCH) "

  # "/" covers .github/workflows; the local composite actions have to be named separately.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    commit-message:
      prefix: "(PATCH) "
