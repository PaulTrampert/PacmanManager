name: Docker Build

# Builds every deployable image, whichever part of the repository changed. Check Changes calls it for
# any change that is not documentation alone; it can also be run by hand.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: repohost
            context: .
            dockerfile: PacmanManager.RepoHost/Dockerfile
          - name: migrations
            context: .
            dockerfile: PacmanManager.Migrations/Dockerfile
          # The web image's context is its own directory, so it never sees the .NET sources.
          - name: web
            context: pacmanmanager-web
            dockerfile: pacmanmanager-web/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # push: false is the point of this job. The project is unreleased; building the image is a
      # sanity check that the Dockerfile and its COPY lines still match the solution layout.
      # Nothing is tagged for a registry and no registry credentials are used.
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
