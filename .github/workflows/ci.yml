name: CI

# The repository is unreleased, so this pipeline is purely a gate: it builds, it tests, and it
# proves both container images still build. Nothing is published.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR makes the in-flight run irrelevant. `main` is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only this job needs to write: the results publisher posts a check run and a PR comment.
    # `issues: read` and `contents: read` are what that action additionally wants on a private
    # repository; the `docker` job keeps the workflow-level read-only default.
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      # The runner image is Ubuntu, and this is a pacman repository host. See
      # docs/cloud-environment.md, which installs the same set for cloud dev sessions:
      #   pacman-package-manager  repo-add / repo-remove, which RepoHost shells out to
      #   libalpm-dev             the libalpm.so symlink NativeMethods' DllImport resolves
      #   libarchive-tools, zstd  bsdtar and zstd, used by the package fixtures
      - name: Install pacman tooling and libalpm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            pacman-package-manager \
            libalpm-dev \
            libarchive-tools \
            zstd

      # Antlr4BuildTasks runs the ANTLR jar to generate the pacman.conf parser, so the build
      # itself needs a JRE. Pinning one beats relying on whatever the runner image ships.
      # 25 is the current LTS and the newest ANTLR runs on: checked by deleting LibAlpmSharp/obj
      # and regenerating the parser under it, which produced the same sources and built clean.
      - name: Set up Java for the ANTLR build task
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore PacmanManager.sln

      - name: Build
        run: dotnet build PacmanManager.sln --configuration Release --no-restore

      # AlpmPackageTests and AlpmDatabaseTests.GetPackages_ReturnsListOfPackages read the *host's*
      # local pacman database and expect an installed package named `pacman`. That exists on Arch
      # and not on this runner, so they are excluded rather than left to fail. Everything else in
      # the solution runs, the end to end fixtures included: the runner's Docker daemon is what
      # Testcontainers starts Postgres and Keycloak on and what builds the two images under test.
      # The lasting fix belongs in the tests (seed a local database under a temporary root and
      # point LibAlpm.Initialize at it); until then this filter is the boundary.
      # verbosity=minimal prints failures and the summary but not a line per passing test. At
      # `normal` a run emits several thousand lines, and the failures scroll off the top of what
      # the Actions log API will hand back, which is exactly when you need to read them.
      - name: Test
        run: |
          dotnet test PacmanManager.sln \
            --configuration Release \
            --no-build \
            --filter "FullyQualifiedName!~AlpmPackageTests&FullyQualifiedName!~AlpmDatabaseTests.GetPackages" \
            --logger "trx" \
            --logger "console;verbosity=minimal" \
            --results-directory artifacts/test-results

      # Turns the trx files into something readable: one PR comment, updated in place on every
      # later run rather than piling up, plus a "Test results" check run carrying the per-test
      # detail and the stack trace of anything that failed. The raw log stays the fallback, not
      # the only way to find out what broke.
      #
      # Skipped for pull requests from forks, which run with a read-only token: the comment and
      # check-run writes would fail with "Resource not accessible by integration". Publishing for
      # forks needs the separate workflow_run setup the action documents, which is only worth
      # adding if this repository starts taking fork contributions.
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          files: artifacts/test-results/**/*.trx
          check_name: Test results
          comment_mode: always

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: warn

  # The Ubuntu job above cannot run the fixtures that read the host's *local* pacman database and
  # expect an installed package named `pacman`, so it filters them out. Here they are the point:
  # on archlinux/archlinux that package is really installed, the local database is really
  # populated, and the whole LibAlpmSharp suite runs unfiltered -- 299 tests rather than the 254
  # Ubuntu sees. The overlap with the Ubuntu job is deliberate: between them they prove the
  # binding works both on Arch and on a distribution that only has libalpm.
  libalpm:
    name: LibAlpmSharp on Arch
    runs-on: ubuntu-latest
    container: archlinux/archlinux
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      # Before the checkout, which wants git. The keyring refresh first is the standard guard
      # against a base image old enough that its keys no longer verify the current mirrors.
      - name: Install the toolchain
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm --needed dotnet-sdk jre-openjdk-headless git

      - uses: actions/checkout@v5

      - name: Test
        run: |
          dotnet test LibAlpmSharp.Test \
            --configuration Release \
            --logger "trx" \
            --logger "console;verbosity=minimal" \
            --results-directory artifacts/test-results

      # Its own check name, and no PR comment: the Ubuntu job owns the comment, and two of them
      # would just be noise. The check run carries the per-test detail for this suite.
      - name: Publish Arch test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          files: artifacts/test-results/**/*.trx
          check_name: Test results (Arch)
          comment_mode: "off"

      - name: Upload Arch test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-arch
          path: artifacts/test-results
          if-no-files-found: warn

  docker:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: repohost
            dockerfile: PacmanManager.RepoHost/Dockerfile
          - name: migrations
            dockerfile: PacmanManager.Migrations/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # push: false is the point of this job. The project is unreleased; building the image is a
      # sanity check that the Dockerfile and its COPY lines still match the solution layout.
      # Nothing is tagged for a registry and no registry credentials are used.
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
