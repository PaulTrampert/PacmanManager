name: Claude

# The repository owner mentions @claude on a pull request -- in a PR comment, an inline review
# comment, or a review body -- and Claude answers or makes the change on the PR branch. Each run
# starts fresh and reads the PR for its context. See AGENTS.md, "Continuous integration".
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# One run per PR at a time. A second request queues behind the first rather than cancelling it,
# since cancelling could strand a half-pushed change.
concurrency:
  group: claude-pr-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  claude:
    # Only the owner: the action would otherwise accept anyone with write access. Claude's own
    # replies are posted as claude[bot], so they never match and cannot re-trigger it.
    if: >-
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.login == github.repository_owner
        && contains(github.event.comment.body, '@claude'))
      || (github.event_name == 'pull_request_review_comment'
        && github.event.comment.user.login == github.repository_owner
        && contains(github.event.comment.body, '@claude'))
      || (github.event_name == 'pull_request_review'
        && github.event.review.user.login == github.repository_owner
        && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      # Exchanged for the Claude GitHub App's token. Pushes made with that token trigger CI, which
      # pushes made with the workflow's own GITHUB_TOKEN would not.
      id-token: write
    steps:
      # Full history, so a requested merge of main into the branch has something to merge.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up the build toolchain
        uses: ./.github/actions/setup-toolchain

      # No `prompt`, so the action runs in its @claude mode: it checks out the PR branch, reads the
      # PR and the triggering comment, and replies in a progress comment. No `github_token`, so it
      # uses the Claude GitHub App's. AGENTS.md is the repository's CLAUDE.md and is read as usual.
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --allowedTools "Bash(dotnet:*),Bash(git:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh run view:*),Bash(gh issue view:*)"
            --disallowedTools "Bash(gh pr merge:*)"
