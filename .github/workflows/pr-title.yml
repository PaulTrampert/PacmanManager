name: PR Title

# CONTRIBUTING.md requires every PR title to declare its change level, because that prefix is what
# a release reads to pick the next version number.
#
# This delegates to the shared reusable workflow rather than checking the title here, so the rule
# and its wording stay the same across repositories. The change level it enforces is the
# parenthesised form -- "(MINOR) Add a feature" -- which is also what paulhatch/semantic-version
# reads in the shared version.yml.
#
# Kept separate from ci.yml so that `edited` can be in the trigger list: a mistyped prefix is fixed
# by editing the title and the check re-runs on its own, where putting `edited` on ci.yml would
# re-run the whole test and image-build matrix on every title or description tweak.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

jobs:
  check-title:
    uses: PaulTrampert/github-workflows/.github/workflows/check-pr-title.yml@main
    permissions:
      pull-requests: write
      contents: read
